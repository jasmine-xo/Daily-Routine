name: Build APK fixed
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack project and add model files
        run: |
          unzip -q JasmineRoutineApp.zip
          cp *.onnx JasmineApp/app/src/main/assets/ || echo "no model files found"
      - name: Fix library import paths
        run: |
          F=JasmineApp/app/src/main/java/com/jasmine/routine/WakeWordService.kt
          curl -sSL -o lib.aar https://repo1.maven.org/maven2/xyz/rementia/openwakeword/0.1.3/openwakeword-0.1.3.aar
          unzip -q -o lib.aar classes.jar -d aar
          echo "Classes found in library:"
          unzip -Z1 aar/classes.jar | grep -E 'WakeWord|DetectionMode' || true
          P=$(unzip -Z1 aar/classes.jar | grep -E '[/$]WakeWordModel\.class$' | head -1 | sed 's#\.class$##; s#/#.#g; s#\$#.#g')
          echo "WakeWordModel is at: $P"
          if [ -n "$P" ]; then sed -i "s#^import com.rementia.openwakeword.lib.WakeWordModel\$#import $P#" "$F"; fi
          sed -i '/DetectionMode/d' "$F"
          grep -n "import com.rementia" "$F"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build debug APK
        run: gradle assembleDebug --stacktrace -p JasmineApp
      - uses: actions/upload-artifact@v4
        with:
          name: JasmineRoutine-apk
          path: JasmineApp/app/build/outputs/apk/debug/app-debug.apk
