name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack project and add model files
        run: |
          unzip -q JasmineRoutineApp.zip
          cp *.onnx JasmineApp/app/src/main/assets/ || echo "no model files found"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build debug APK
        run: gradle assembleDebug --stacktrace -p JasmineApp
      - uses: actions/upload-artifact@v4
        with:
          name: JasmineRoutine-apk
          path: JasmineApp/app/build/outputs/apk/debug/app-debug.apk
